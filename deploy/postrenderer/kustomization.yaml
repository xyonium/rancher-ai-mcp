resources:
  - rendered.yaml
# The shipped default appends NO flags: the rendered deployment is exactly what
# the chart produced (a no-op passthrough), which is the least-privilege
# posture on the no-rebuild delivery path.
#
# Uncommenting this block appends privileges to the mcp container's args.
# Each entry you keep must be a deliberate operator decision:
#
#   --allow-auto-write  lets the create/update-class operations (operation:
#                       createKubernetesResource, patchKubernetesResource,
#                       createProject, createCustomCluster, createImportedCluster,
#                       createK3kCluster, scaleClusterNodePool) of executeChange
#                       execute WITHOUT the per-operation user confirmation.
#                       For trusted automation only.
#   --enable-exec       enables the execPod operation of planChange/executeChange,
#                       which runs arbitrary commands inside a pod container.
#                       It does not change the tool surface: without it the
#                       operation is refused at runtime.
#
# deleteKubernetesResource and execPod remain fully gated regardless: even in
# auto-write mode they still require a fresh plan, the single-use
# confirmationToken and a server-initiated user confirmation.
# patches:
#   - target:
#       kind: Deployment
#       name: rancher-mcp-server
#     patch: |-
#       - op: add
#         path: /spec/template/spec/containers/0/args/-
#         value: "--allow-auto-write"
#       - op: add
#         path: /spec/template/spec/containers/0/args/-
#         value: "--enable-exec"
